[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ecom-market-pulse"
version = "0.1.0"
description = "可追溯的跨境电商卖家决策情报 Skill"
readme = "skills/ecom-market-pulse/SKILL.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "duckdb>=1.0,<2",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "tenacity>=8.2,<10",
    "trafilatura>=1.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["skills/ecom-market-pulse/scripts/ecom_market_pulse"]
